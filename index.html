<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ziki Points Pop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--ink:#2b2350;--paper:#fff8e1}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;color:var(--ink);overflow-x:hidden;
    font:17px/1.5 Fredoka,"Trebuchet MS","Segoe UI",system-ui,sans-serif;
    background:
      radial-gradient(circle at 12% 18%, #ffd1e3 0 110px, transparent 111px),
      radial-gradient(circle at 90% 12%, #cfe8ff 0 140px, transparent 141px),
      radial-gradient(circle at 80% 88%, #c9f5d9 0 120px, transparent 121px),
      radial-gradient(circle at 8% 85%, #e3d4ff 0 100px, transparent 101px),
      var(--paper)}
  main{width:100%;max-width:540px;padding:24px 16px;text-align:center}
  .card{position:relative;background:#fff;border:4px solid var(--ink);border-radius:30px;padding:30px 20px 26px;box-shadow:8px 8px 0 var(--ink)}
  .label{font-weight:600;letter-spacing:.04em}
  .mascot{font-size:3rem;display:inline-block;animation:wiggle 2.5s ease-in-out infinite}
  .score{font-size:5.2rem;font-weight:700;line-height:1.1;display:inline-block;
    background:linear-gradient(90deg,#ff5fa2,#ff9f1c,#12b886,#4f8bff,#9b5de5,#ff5fa2);background-size:300% 100%;
    -webkit-background-clip:text;background-clip:text;color:transparent;animation:flow 5s linear infinite}
  .score.pop{animation:flow 5s linear infinite,bounce .8s cubic-bezier(.3,1.6,.5,1)}
  .sign{display:inline-block;margin-top:6px;padding:6px 18px;border:3px solid var(--ink);border-radius:999px;font-weight:700;font-size:1.2rem;background:#ffe27a;
    opacity:0;transform:scale(.6) rotate(-6deg)}
  .sign.show{animation:sign 1.7s ease-out}
  button{font:inherit;font-weight:700;cursor:pointer;margin-top:22px;border:3px solid var(--ink);border-radius:18px;background:#ff5fa2;color:#fff;
    padding:12px 24px;min-height:52px;box-shadow:5px 5px 0 var(--ink);transition:transform .12s;text-shadow:1px 1px 0 var(--ink)}
  button:hover{transform:translate(-2px,-2px) rotate(-1.5deg)}
  button:active{transform:translate(4px,4px);box-shadow:1px 1px 0 var(--ink)}
  button:focus-visible{outline:4px solid #4f8bff;outline-offset:3px}
  .hint{margin-top:14px;font-size:.95rem}
  .note{font-size:.82rem;margin-top:26px;background:#fff;border:2px solid var(--ink);border-radius:14px;padding:10px 14px}
  canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
  @keyframes flow{to{background-position:300% 0}}
  @keyframes wiggle{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg) translateY(-4px)}}
  @keyframes bounce{0%{transform:scale(1)}35%{transform:scale(1.4) rotate(-4deg)}65%{transform:scale(.9) rotate(3deg)}100%{transform:scale(1)}}
  @keyframes sign{0%{opacity:0;transform:scale(.6) rotate(-6deg)}15%{opacity:1;transform:scale(1.2) rotate(4deg)}
    30%{opacity:.4}45%{opacity:1}60%{opacity:.4}75%{opacity:1;transform:scale(1) rotate(0)}100%{opacity:0;transform:scale(1) rotate(0)}}
  @media (prefers-reduced-motion: reduce){
    .mascot{animation:none}
    .score,.score.pop{animation:none;background:none;color:#4f8bff}
    .sign.show{animation:none;opacity:1;transform:none}
    button:hover{transform:none}
  }
</style>
</head>
<body>
<main>
  <div class="card">
    <div class="mascot" aria-hidden="true">🤖</div><br>
    <span class="label">Your agents earned</span><br>
    <div class="score" id="score" aria-live="polite">5</div><span class="label"> pts</span><br>
    <span class="sign" id="sign" aria-hidden="true">⭐ +60 pts! ⭐</span>
    <br>
    <button id="btn">🎉 Agent finished a review!</button>
    <p class="hint">Press the button and watch the points party.</p>
  </div>
  <p class="note">Concept by Harshita Sharma for the HNG15 whimsical design task. One element only: the Ziki points counter. Example data, not the official Ziki site.</p>
</main>
<canvas id="cv" aria-hidden="true"></canvas>

<script>
(function(){
  var score=document.getElementById('score'), sign=document.getElementById('sign'), btn=document.getElementById('btn');
  var cv=document.getElementById('cv'), ctx=cv.getContext('2d'), bits=[], running=false;
  var reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var colors=['#ff5fa2','#ff9f1c','#12b886','#4f8bff','#9b5de5','#ffd43b'];

  function size(){cv.width=window.innerWidth;cv.height=window.innerHeight;}
  window.addEventListener('resize',size); size();

  function burst(){
    var r=score.getBoundingClientRect(), x=r.left+r.width/2, y=r.top+r.height/2;
    for(var i=0;i<110;i++){
      var a=Math.random()*Math.PI*2, s=4+Math.random()*8;
      bits.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-5,g:.22,w:6+Math.random()*7,h:9+Math.random()*9,
        c:colors[i%colors.length],rot:Math.random()*6,vr:(Math.random()-.5)*.4,life:90+Math.random()*50,round:i%4===0});
    }
    if(!running){running=true;requestAnimationFrame(tick);}
  }
  function tick(){
    ctx.clearRect(0,0,cv.width,cv.height);
    bits=bits.filter(function(b){return b.life>0 && b.y<cv.height+30;});
    bits.forEach(function(b){
      b.x+=b.vx; b.y+=b.vy; b.vy+=b.g; b.vx*=.99; b.rot+=b.vr; b.life--;
      ctx.save(); ctx.translate(b.x,b.y); ctx.rotate(b.rot);
      ctx.globalAlpha=Math.min(1,b.life/30); ctx.fillStyle=b.c;
      if(b.round){ctx.beginPath();ctx.arc(0,0,b.w/2,0,Math.PI*2);ctx.fill();}
      else{ctx.fillRect(-b.w/2,-b.h/2,b.w,b.h);}
      ctx.restore();
    });
    if(bits.length){requestAnimationFrame(tick);} else {running=false;ctx.clearRect(0,0,cv.width,cv.height);}
  }
  function count(from,to){
    var start=null,dur=700;
    function step(t){
      if(start===null)start=t;
      var p=Math.min(1,(t-start)/dur);
      score.textContent=Math.round(from+(to-from)*p);
      if(p<1)requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }
  btn.addEventListener('click',function(){
    var from=parseInt(score.textContent,10);
    count(from,from+60);
    score.classList.remove('pop'); sign.classList.remove('show');
    void score.offsetWidth;
    score.classList.add('pop'); sign.classList.add('show');
    if(!reduce)burst();
  });
})();
</script>
</body>
</html>
